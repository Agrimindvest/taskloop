<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TaskLoop — earn · complete · repeat</title>
<style>
  :root{
    --teal-50:#f0fdfa;--teal-100:#ccfbf1;--teal-500:#14b8a6;--teal-600:#0d9488;--teal-700:#0f766e;
    --amber-400:#fbbf24;--amber-500:#f59e0b;--amber-600:#d97706;
    --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;
    --slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;
    --danger:#dc2626;--danger-bg:#fee2e2;--success:#16a34a;--success-bg:#dcfce7;
    --radius:14px;--radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 4px 16px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
    --shadow-lg:0 12px 40px rgba(15,23,42,.10),0 2px 6px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--slate-50);color:var(--slate-900);margin:0;min-height:100vh;-webkit-font-smoothing:antialiased}
  .bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60% 50% at 8% 0%,rgba(20,184,166,.18),transparent 60%),
      radial-gradient(50% 45% at 92% 8%,rgba(251,191,36,.14),transparent 60%),
      radial-gradient(65% 55% at 50% 100%,rgba(13,148,136,.10),transparent 60%),
      var(--slate-50);
  }
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.035) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);
  }
  .app-shell{max-width:1200px;margin:0 auto;padding:0 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;margin:16px 0 24px;
    background:rgba(255,255,255,.75);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(226,232,240,.9);border-radius:16px;box-shadow:var(--shadow);flex-wrap:wrap;gap:12px;
    position:sticky;top:12px;z-index:50}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .brand-name{font-size:19px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--teal-600),var(--teal-500) 55%,var(--amber-500));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-tag{color:var(--slate-400);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    background:linear-gradient(90deg,#0d9488,#14b8a6 40%,#f59e0b 80%,#0d9488);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:tagFlow 8s linear infinite}
  @keyframes tagFlow{0%{background-position:0% 0}100%{background-position:300% 0}}
  .hamburger{margin-left:auto}
  .hamburger button.hb{padding:9px;border-radius:10px;border:1px solid rgba(226,232,240,.9);background:#fff;cursor:pointer;
    display:flex;flex-direction:column;gap:4px;width:42px;height:42px;align-items:center;justify-content:center;transition:transform .08s ease}
  .hamburger button.hb:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .hamburger button.hb span{display:block;width:20px;height:2px;background:var(--slate-700);border-radius:2px;transition:transform .2s ease,opacity .2s ease}
  .hamburger.open button.hb span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .hamburger.open button.hb span:nth-child(2){opacity:0}
  .hamburger.open button.hb span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  .drawer-scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:90}
  .drawer-scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:88vw;background:#fff;z-index:100;
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,23,42,.25)}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:20px;border-bottom:1px solid var(--slate-200);display:flex;align-items:center;gap:12px}
  .drawer-body{padding:12px;overflow-y:auto;flex:1}
  .drawer-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;color:var(--slate-700);
    font-weight:600;font-size:14.5px;border:none;background:transparent;width:100%;text-align:left;transition:background .12s ease,color .12s ease}
  .drawer-item:hover{background:var(--slate-100)}
  .drawer-item.active{background:linear-gradient(180deg,var(--teal-500),var(--teal-600));color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.3)}
  .drawer-item.logout{color:#b91c1c}
  .drawer-item.logout:hover{background:var(--danger-bg)}
  .drawer-sep{height:1px;background:var(--slate-200);margin:8px 6px}
  .drawer-foot{padding:14px 20px;border-top:1px solid var(--slate-200);color:var(--slate-400);font-size:12px;text-align:center}
  .drawer-foot a{color:var(--teal-600);text-decoration:none;font-weight:600}
  .card{background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:24px;max-width:620px;margin:24px auto;box-shadow:var(--shadow)}
  .card.wide{max-width:none}
  .hero{position:relative;overflow:hidden;padding:56px 24px 40px;border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.4));
    border:1px solid rgba(226,232,240,.9);box-shadow:var(--shadow-lg);text-align:center}
  .hero h1{font-size:clamp(30px,4.5vw,52px);line-height:1.05;margin:18px 0 12px;letter-spacing:-.03em}
  .hero .grad{background:linear-gradient(90deg,var(--teal-700),var(--teal-500) 45%,var(--amber-500),var(--teal-700));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:gradShift 6s ease-in-out infinite}
  @keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .hero p.lede{color:var(--slate-600);font-size:17px;max-width:640px;margin:0 auto 28px;min-height:2.6em}
  .cursor{display:inline-block;width:2px;height:1em;background:var(--teal-600);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  input,select,textarea{display:block;width:100%;padding:11px 12px;margin:6px 0 14px;border:1px solid var(--slate-300);border-radius:var(--radius-sm);
    font-size:14.5px;font-family:inherit;background:#fff;color:var(--slate-900);transition:border-color .15s ease,box-shadow .15s ease}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 4px rgba(20,184,166,.15)}
  label.lbl{font-size:13px;color:var(--slate-600);font-weight:600}
  .btn{padding:11px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:700;
    transition:transform .06s ease,box-shadow .15s ease,filter .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:linear-gradient(180deg,var(--teal-500),var(--teal-600));color:#fff;box-shadow:0 8px 20px rgba(13,148,136,.3)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.05)}
  .btn-amber{background:linear-gradient(180deg,var(--amber-400),var(--amber-600));color:#fff;box-shadow:0 8px 20px rgba(217,119,6,.3)}
  .btn-danger{background:var(--danger-bg);color:#b91c1c}
  .btn-full{width:100%;margin-top:16px}
  .pill{display:inline-block;padding:4px 11px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:26px}
  .step-card{background:rgba(255,255,255,.9);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:22px;
    box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .2s ease}
  .step-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .step-card .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;
    background:linear-gradient(180deg,var(--teal-500),var(--teal-600));color:#fff;font-weight:800;font-size:14px;margin-bottom:10px;
    box-shadow:0 6px 14px rgba(13,148,136,.28)}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .stat{background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:18px;
    box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--teal-500),var(--teal-700));opacity:.9}
  .stat-label{font-size:12px;color:var(--slate-500);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
  .stat-value{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
  .task-card{background:rgba(255,255,255,.94);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:18px;
    box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .2s ease}
  .task-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .row{background:rgba(255,255,255,.94);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius-sm);padding:16px;margin:10px 0;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
  .banner{padding:14px 16px;border-radius:var(--radius-sm);font-weight:700;text-align:center;margin-bottom:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;padding:13px 22px;border-radius:12px;z-index:999;
    box-shadow:var(--shadow-lg);font-weight:600;animation:toastIn .22s ease}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .muted{color:var(--slate-500)}.center{text-align:center}
  .progress-bg{height:7px;background:rgba(148,163,184,.25);border-radius:999px;margin-top:10px;overflow:hidden}
  .progress-fg{height:100%;background:linear-gradient(90deg,var(--teal-500),var(--teal-700));border-radius:999px;transition:width .4s ease}
  .footer{text-align:center;margin-top:40px;padding:20px;color:var(--slate-400);font-size:13px}
  .footer a{color:var(--teal-600);text-decoration:none;font-weight:600}
  .footer a:hover{text-decoration:underline}
  a{color:var(--teal-600)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>

<div class="drawer-scrim" id="drawer-scrim" onclick="closeDrawer()"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   TaskLoop — main app (worker + advertiser)
   Backend: Supabase (Postgres + RLS + SQL functions)
   Every write goes through an SQL function. Client never writes
   to tables directly. See /supabase/migrations for schema.
   ============================================================ */

/* ---------------- CONFIG ---------------- */
var SUPABASE_URL = "https://jcajknuldlkuwtxhymbt.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpjYWprbnVsZGxrdXd0eGh5bWJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NjE1MjIsImV4cCI6MjEwNTEzNzUyMn0.erATFYwKkdq6crbHqu1KG3OknUCEDcN6CvvkGDHZRn8";

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ---------------- CONSTANTS ---------------- */
var TIERS = [
  { id:"free",name:"Free",fee:0 },{ id:"starter",name:"Starter",fee:1000 },
  { id:"growth",name:"Growth",fee:3250 },{ id:"professional",name:"Professional",fee:5500 },
  { id:"elite",name:"Elite",fee:7750 },{ id:"executive",name:"Executive",fee:10000 }
];
var CATEGORIES = {

  Share:    { payout:20, color:"#16a34a", template:"Share the target post to your timeline or a group. Keep it visible for 24h." },

  Survey:   { payout:50, color:"#f43f5e", template:"Complete the survey to the end. Attention-check questions must be correct." }
};
var MIN_TASK_QTY = 20;
var TARGET_ON_PAGE_MS = 4000;

var WITHDRAW_MIN = { task:10000, affiliate:1000 };
var WITHDRAW_DAYS = { task:[15], affiliate:[1,3,5] };
var BANK = { number:"5012652807", name:"PEER PULSE TECHNOLOGY", bank:"Safe Haven MFB" };
var ADMIN_EMAIL = "lifedreamguarantor@gmail.com";

/* ---------------- HELPERS ---------------- */
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function isBlockedDay(){var d=new Date().getDay();return d===5||d===6}
function fmtN(n){return "\u20A6"+Number(n||0).toLocaleString("en-NG")}
function tierById(id){for(var i=0;i<TIERS.length;i++)if(TIERS[i].id===id)return TIERS[i];return TIERS[0]}
function nextWithdrawDate(type){var t=new Date();for(var i=0;i<40;i++){var d=new Date(t);d.setDate(t.getDate()+i);if(type==="task"){if(d.getDate()===15)return d.toDateString()}else{if(WITHDRAW_DAYS.affiliate.indexOf(d.getDay())!==-1)return d.toDateString()}}return "—"}
function esc(s){var d=document.createElement("div");d.innerText=s==null?"":s;return d.innerHTML}
function qs(k){return new URLSearchParams(window.location.search).get(k)}

/* ---------------- LOCAL SESSION (client-only) ---------------- */
var SESSION_KEY = "taskloop_session";
function getSession(){
  try{ return JSON.parse(localStorage.getItem(SESSION_KEY)||"null") }catch(e){ return null }
}
function setSession(s){
  if(s) localStorage.setItem(SESSION_KEY, JSON.stringify(s));
  else localStorage.removeItem(SESSION_KEY);
}

/* ---------------- STATE ---------------- */
var state = {
  user: null,           // current user row from DB
  tasks: [],
  submissions: [],
  ledger: [],
  route: "loading",
  activeStart: null,
  upgradeStage: "select",
  upgradeTierId: "starter"
};

/* ---------------- TOAST ---------------- */
var toastTimer=null;
function notify(msg,kind){
  var el=document.getElementById("toast"); if(!el) return;
  el.textContent=msg;
  el.style.display="block";
  el.style.background=kind==="error"?"#dc2626":kind==="success"?"#16a34a":"#0f172a";
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.style.display="none"},3500);
}

/* ---------------- DRAWER ---------------- */
function openDrawer(){document.getElementById("drawer").classList.add("open");document.getElementById("drawer-scrim").classList.add("open");document.body.style.overflow="hidden"}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("drawer-scrim").classList.remove("open");document.body.style.overflow=""}
function toggleDrawer(){document.getElementById("drawer").classList.contains("open")?closeDrawer():openDrawer()}
function navTo(r){closeDrawer();state.route=r;render()}

function iconFor(name){
  var i={
    dashboard:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
    submissions:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 12l2 2 4-4"/><rect x="3" y="4" width="18" height="16" rx="2"/></svg>',
    wallet:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/></svg>',
    upgrade:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2l3 7 7 .5-5.5 4.5L18 21l-6-3.5L6 21l1.5-7L2 9.5 9 9z"/></svg>',
    createTask:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    myTasks:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 5h18M3 12h18M3 19h12"/></svg>',
    settings:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 15 4.6a1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>',
    logout:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>',
    home:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1z"/></svg>',
    signup:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><path d="M19 8v6M22 11h-6"/></svg>',
    login:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>'
  };
  return i[name]||"";
}
function renderDrawer(){
  var user=state.user, r=state.route, items=[];
  function item(key,label,route){return '<button class="drawer-item'+(r===route?" active":"")+'" onclick="navTo(\''+route+'\')"><span class="ico">'+iconFor(key)+'</span><span>'+label+'</span></button>'}
  if(!user){
    items.push(item("home","Home","landing"));
    items.push(item("signup","Sign up","signup"));
    items.push(item("login","Log in","login"));
  } else {

async function loadUser(){
  var s=getSession();
  if(!s||!s.userId){ state.user=null; return }
  try{
    var {data,error} = await sb.from("users").select("*").eq("id",s.userId).single();
    if(error||!data){ setSession(null); state.user=null; return }
    state.user = data;
  }catch(e){
    setSession(null); state.user=null;
  }
}
async function loadTasks(){
  try{
    var {data} = await sb.from("tasks").select("*").eq("status","live").order("created_at",{ascending:false});
    state.tasks = data||[];

async function loadSubmissions(){

    state.submissions = data||[];

async function loadLedger(){

var activeStartTimer=null;
async function startTask(taskId){
  try{
    var {data,error} = await sb.rpc("fn_start_task",{p_task_id:taskId,p_worker_id:state.user.id});
    if(error) throw new Error(error.message);
    state.activeStart = {startId:data.startId, startedAt:data.startedAt, taskId:taskId};
    state.currentTask = state.tasks.filter(function(t){return t.id===taskId})[0];
    go("task");

var pendingScreenshot=null;
function onProofFileChange(input){
  var f=input.files&&input.files[0]; if(!f){pendingScreenshot=null;return}
  var r=new FileReader();
  r.onload=function(){ pendingScreenshot=r.result };
  r.readAsDataURL(f);
}

async function submitTask(){
  var start=state.activeStart;
  if(!start){notify("No active task","error");return}

  var btn=document.getElementById("task-submit-btn");
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Submitting…'}

  try{
    // Screenshot never uploaded — only its presence is noted.
    var key = pendingScreenshot ? ("local:"+uid()) : null;
    var {data,error} = await sb.rpc("fn_submit_task",{
      p_start_id:start.startId, p_worker_id:state.user.id, p_screenshot_key:key
    });
    if(error) throw new Error(error.message);
    state.activeStart=null; pendingScreenshot=null;
    notify(data.status==="rejected" ? ("Auto-rejected: "+data.reason) : "Submitted — pending admin review",
           data.status==="rejected" ? "error":"success");
    await loadSubmissions();
    go("submissions");
  }catch(e){
    notify(e.message||"Submit failed","error");
    if(btn){btn.disabled=false;btn.textContent="Submit"}
  }
}

var heroPhrases=[
  "Complete simple social tasks. Get paid per completion.",
  "No daily caps. Work at your own pace.",

  "Screenshots stay on your device — we never store them.",

var typerState={el:null,phraseIdx:0,charIdx:0,dir:1,timer:null};
function startHeroTyper(){
  clearTimeout(typerState.timer);
  typerState.el=document.getElementById("hero-typer");
  if(!typerState.el) return;
  typerState.charIdx=0; typerState.dir=1;
  function tick(){
    var el=typerState.el; if(!el) return;
    var phrase=heroPhrases[typerState.phraseIdx];
    if(typerState.dir===1){
      typerState.charIdx++;
      if(typerState.charIdx>=phrase.length){
        el.textContent=phrase;
        typerState.dir=0;
        typerState.timer=setTimeout(function(){ typerState.dir=-1; tick() },1600);
        return;
      }
    } else {
      typerState.charIdx--;
      if(typerState.charIdx<=0){
        typerState.charIdx=0; typerState.dir=1;
        typerState.phraseIdx=(typerState.phraseIdx+1)%heroPhrases.length;
      }
    }
    el.textContent=phrase.slice(0,typerState.charIdx);
    typerState.timer=setTimeout(tick, typerState.dir===1?38:20);
  }
  tick();
}

  return '<div class="card wide" style="max-width:720px;">'+
    '<h2>Post a task</h2>'+
    '<label class="lbl">Category</label>'+
    '<select id="ct-category" onchange="onCategoryChange()">'+catOptions+'</select>'+
    '<label class="lbl">Link / URL</label>'+
    '<input id="ct-link" placeholder="https://…" />'+
    '<label class="lbl">Quantity (min '+MIN_TASK_QTY+', no max)</label>'+
    '<input id="ct-quantity" type="number" value="'+MIN_TASK_QTY+'" oninput="updateTaskTotals()" />'+
    '<label class="lbl">Reward per task (min '+fmtN(d.payout)+' — can only increase)</label>'+
    '<input id="ct-reward" type="number" value="'+d.payout+'" oninput="updateTaskTotals()" />'+
    '<label class="lbl">Instructions</label>'+
    '<textarea id="ct-instructions" style="min-height:90px;">'+d.template+'</textarea>'+
    '<label style="display:flex;gap:8px;align-items:center;margin:12px 0;"><input type="checkbox" id="ct-premium" /> Premium lane (+40%) — routes to paid-tier workers first</label>'+
    '<div style="background:rgba(241,245,249,.7); border:1px solid var(--slate-200); border-radius:12px; padding:14px;">'+
      '<div>Worker payout total: <strong id="ct-worker-total">'+fmtN(d.payout*MIN_TASK_QTY)+'</strong></div>'+
      '<div>Platform commission (50%): <strong id="ct-commission">'+fmtN(d.payout*MIN_TASK_QTY*0.5)+'</strong></div>'+
      '<div style="border-top:1px solid var(--slate-200); margin-top:6px; padding-top:6px;">You fund: <strong id="ct-grand-total">'+fmtN(d.payout*MIN_TASK_QTY*1.5)+'</strong></div>'+
    '</div>'+
    '<button class="btn btn-primary btn-full" onclick="createTask()">Submit for admin approval</button>'+
  '</div>';
}

function renderMyTasks(){
  var mine=state.tasks.filter(function(t){return t.advertiser_id===state.user.id});
  // Also include pending_approval tasks — reload just in case
  sb.from("tasks").select("*").eq("advertiser_id",state.user.id).order("created_at",{ascending:false}).then(function(res){
    if(res.data && res.data.length!==state.myTasksCount){
      state.myTasksCount=res.data.length;
      state._myTasks=res.data;
      if(state.route==="myTasks") render();
    }
  });
  var list=state._myTasks||mine;
  var rows=list.length===0?'<p class="muted">You haven\'t posted any tasks yet.</p>':list.map(function(t){
    var statusColor=t.status==="live"?"#16a34a":t.status==="completed"?"#0d9488":t.status==="paused"?"#94a3b8":"#d97706";
    var pct=Math.min(100,(t.completed/t.quantity)*100);
    return '<div class="row" style="flex-direction:column;align-items:stretch;">'+
      '<div style="display:flex;justify-content:space-between;"><strong>'+t.category+' &middot; '+fmtN(t.reward)+'/task</strong><span class="pill" style="background:'+statusColor+';">'+t.status+'</span></div>'+
      '<div class="muted" style="font-size:14px;margin-top:6px;">'+t.completed+'/'+t.quantity+' completed — '+fmtN(t.completed*t.reward*1.5)+' of '+fmtN(t.advertiser_total)+' spent</div>'+
      '<div class="progress-bg"><div class="progress-fg" style="width:'+pct+'%;"></div></div>'+
    '</div>';
  }).join("");
  return '<h2>My posted tasks</h2>'+rows;
}

function renderSettings(){
  var user=state.user;
  return '<div class="card">'+
    '<h2>Account settings</h2>'+
    '<label class="lbl">Name</label><input value="'+esc(user.name)+'" disabled />'+
    '<label class="lbl">Email</label><input value="'+esc(user.email)+'" disabled />'+
    '<label class="lbl">Referral code</label><input value="'+esc(user.ref_code)+'" disabled />'+
    '<p class="muted" style="font-size:12px;">To change your name or email, contact support.</p>'+
    '<button class="btn btn-danger" onclick="logout()">Log out</button>'+
  '</div>';
}

/* ---------------- MAIN RENDER ---------------- */
function render(){
  var user=state.user, r=state.route, body="";
  if(r==="loading"){ document.getElementById("root").innerHTML='<div class="card center"><p class="muted">Loading…</p></div>'; return }
  if(r==="landing") body=renderLanding();
  else if(r==="signup") body=renderSignup();
  else if(r==="login") body=renderLogin();
  else if(!user) body=renderLanding();
  else if(r==="dashboard") body=renderDashboard();
  else if(r==="task") body=renderTaskDetail();
  else if(r==="submissions") body=renderSubmissions();
  else if(r==="wallet") body=renderWallet();
  else if(r==="upgrade") body=renderUpgrade();
  else if(r==="createTask") body=renderCreateTask();
  else if(r==="myTasks") body=renderMyTasks();
  else if(r==="settings") body=renderSettings();
  else body=user?renderDashboard():renderLanding();

  document.getElementById("root").innerHTML=renderTopBar()+'<div>'+body+'</div>'+'<div id="toast" class="toast" style="display:none;"></div>';
  renderDrawer();
  if(r==="task" && state.activeStart) startTaskTimer();
  if(r==="landing") startHeroTyper();
}

function startTaskTimer(){
  clearInterval(activeStartTimer);
  activeStartTimer=setInterval(function(){
    var s=state.activeStart;
    if(!s||state.route!=="task"){clearInterval(activeStartTimer);return}
    var elapsed=Date.now()-s.startedAt;
    var remaining=Math.max(0,TARGET_ON_PAGE_MS-elapsed);
    var t=document.getElementById("task-timer");
    var b=document.getElementById("task-submit-btn");
    if(t){
      t.textContent=remaining>0?("Stay on this page for "+(remaining/1000).toFixed(1)+"s"):"You may submit now";
      t.style.background=remaining>0?"#fef3c7":"#dcfce7";
      t.style.color=remaining>0?"#92400e":"#166534";
    }
    if(b) b.disabled=remaining>0;
  },200);
}

/* ---------------- BOOT ---------------- */
(async function boot(){
  await loadUser();
  if(state.user){
    state.route="dashboard";
    await Promise.all([loadTasks(),loadSubmissions(),loadLedger()]);
  } else {
    state.route="landing";
    await loadTasks();
  }
  render();
})();
</script>
</body>
</html>
