<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TaskLoop — earn · complete · repeat</title>
<style>
  :root{
    --teal-50:#f0fdfa;--teal-100:#ccfbf1;--teal-500:#14b8a6;--teal-600:#0d9488;--teal-700:#0f766e;
    --amber-400:#fbbf24;--amber-500:#f59e0b;--amber-600:#d97706;
    --slate-50:#f8fafc;--slate-100:#f1f5f9;--slate-200:#e2e8f0;--slate-300:#cbd5e1;--slate-400:#94a3b8;
    --slate-500:#64748b;--slate-600:#475569;--slate-700:#334155;--slate-800:#1e293b;--slate-900:#0f172a;
    --danger:#dc2626;--danger-bg:#fee2e2;--success:#16a34a;--success-bg:#dcfce7;
    --radius:14px;--radius-sm:10px;
    --shadow-sm:0 1px 2px rgba(15,23,42,.05);
    --shadow:0 4px 16px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.05);
    --shadow-lg:0 12px 40px rgba(15,23,42,.10),0 2px 6px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--slate-50);color:var(--slate-900);margin:0;min-height:100vh;-webkit-font-smoothing:antialiased}
  .bg{position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(60% 50% at 8% 0%,rgba(20,184,166,.18),transparent 60%),
      radial-gradient(50% 45% at 92% 8%,rgba(251,191,36,.14),transparent 60%),
      radial-gradient(65% 55% at 50% 100%,rgba(13,148,136,.10),transparent 60%),
      var(--slate-50);
  }
  .bg::after{content:"";position:absolute;inset:0;
    background-image:linear-gradient(rgba(15,23,42,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(15,23,42,.035) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 30%,#000 40%,transparent 100%);
  }
  .app-shell{max-width:1200px;margin:0 auto;padding:0 20px 80px}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;margin:16px 0 24px;
    background:rgba(255,255,255,.75);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);
    border:1px solid rgba(226,232,240,.9);border-radius:16px;box-shadow:var(--shadow);flex-wrap:wrap;gap:12px;
    position:sticky;top:12px;z-index:50}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
  .brand-name{font-size:19px;font-weight:800;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--teal-600),var(--teal-500) 55%,var(--amber-500));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .brand-tag{color:var(--slate-400);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    background:linear-gradient(90deg,#0d9488,#14b8a6 40%,#f59e0b 80%,#0d9488);
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:tagFlow 8s linear infinite}
  @keyframes tagFlow{0%{background-position:0% 0}100%{background-position:300% 0}}
  .topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
  .bell{position:relative;padding:9px;border-radius:10px;border:1px solid rgba(226,232,240,.9);background:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .08s ease}
  .bell:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .bell-badge{position:absolute;top:-4px;right:-4px;background:#dc2626;color:#fff;font-size:10px;font-weight:700;
    min-width:18px;height:18px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .hamburger button.hb{padding:9px;border-radius:10px;border:1px solid rgba(226,232,240,.9);background:#fff;cursor:pointer;
    display:flex;flex-direction:column;gap:4px;width:42px;height:42px;align-items:center;justify-content:center;transition:transform .08s ease}
  .hamburger button.hb:hover{box-shadow:var(--shadow-sm);transform:translateY(-1px)}
  .hamburger button.hb span{display:block;width:20px;height:2px;background:var(--slate-700);border-radius:2px;transition:transform .2s ease,opacity .2s ease}
  .hamburger.open button.hb span:nth-child(1){transform:translateY(6px) rotate(45deg)}
  .hamburger.open button.hb span:nth-child(2){opacity:0}
  .hamburger.open button.hb span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
  .notif-panel{position:absolute;top:calc(100% + 8px);right:0;width:380px;max-width:calc(100vw - 40px);
    background:#fff;border:1px solid var(--slate-200);border-radius:14px;box-shadow:var(--shadow-lg);
    z-index:200;overflow:hidden}
  .notif-head{padding:14px 18px;border-bottom:1px solid var(--slate-200);display:flex;justify-content:space-between;align-items:center}
  .notif-head h3{margin:0;font-size:15px}
  .notif-head button{background:none;border:none;color:var(--teal-600);cursor:pointer;font-weight:600;font-size:13px}
  .notif-list{max-height:420px;overflow-y:auto}
  .notif-item{padding:14px 18px;border-bottom:1px solid var(--slate-100);cursor:pointer;transition:background .12s ease}
  .notif-item:hover{background:var(--slate-50)}
  .notif-item.unread{background:linear-gradient(90deg, #f0fdfa, transparent);border-left:3px solid var(--teal-500)}
  .notif-item .t{font-weight:700;font-size:14px;margin-bottom:2px}
  .notif-item .b{font-size:13px;color:var(--slate-600);line-height:1.4}
  .notif-item .m{font-size:11px;color:var(--slate-400);margin-top:4px}
  .notif-item .kind{padding:1px 7px;border-radius:999px;color:#fff;font-size:10px;font-weight:700;margin-right:6px;text-transform:uppercase}
  .notif-empty{padding:40px 20px;text-align:center;color:var(--slate-400);font-size:14px}
  .drawer-scrim{position:fixed;inset:0;background:rgba(15,23,42,.35);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:90}
  .drawer-scrim.open{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:88vw;background:#fff;z-index:100;
    transform:translateX(-102%);transition:transform .24s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,23,42,.25)}
  .drawer.open{transform:translateX(0)}
  .drawer-head{padding:20px;border-bottom:1px solid var(--slate-200);display:flex;align-items:center;gap:12px}
  .drawer-body{padding:12px;overflow-y:auto;flex:1}
  .drawer-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;color:var(--slate-700);
    font-weight:600;font-size:14.5px;border:none;background:transparent;width:100%;text-align:left;transition:background .12s ease,color .12s ease}
  .drawer-item:hover{background:var(--slate-100)}
  .drawer-item.active{background:linear-gradient(180deg,var(--teal-500),var(--teal-600));color:#fff;box-shadow:0 6px 16px rgba(13,148,136,.3)}
  .drawer-item.logout{color:#b91c1c}
  .drawer-item.logout:hover{background:var(--danger-bg)}
  .drawer-sep{height:1px;background:var(--slate-200);margin:8px 6px}
  .drawer-foot{padding:14px 20px;border-top:1px solid var(--slate-200);color:var(--slate-400);font-size:12px;text-align:center;font-style:italic}
  .card{background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:24px;max-width:620px;margin:24px auto;box-shadow:var(--shadow)}
  .card.wide{max-width:none}
  .hero{position:relative;overflow:hidden;padding:56px 24px 40px;border-radius:24px;
    background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,.4));
    border:1px solid rgba(226,232,240,.9);box-shadow:var(--shadow-lg);text-align:center}
  .hero h1{font-size:clamp(30px,4.5vw,52px);line-height:1.05;margin:18px 0 12px;letter-spacing:-.03em}
  .hero .grad{background:linear-gradient(90deg,var(--teal-700),var(--teal-500) 45%,var(--amber-500),var(--teal-700));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:gradShift 6s ease-in-out infinite}
  @keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
  .hero p.lede{color:var(--slate-600);font-size:17px;max-width:640px;margin:0 auto 28px;min-height:2.6em}
  .cursor{display:inline-block;width:2px;height:1em;background:var(--teal-600);margin-left:2px;vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  input,select,textarea{display:block;width:100%;padding:11px 12px;margin:6px 0 14px;border:1px solid var(--slate-300);border-radius:var(--radius-sm);
    font-size:14.5px;font-family:inherit;background:#fff;color:var(--slate-900);transition:border-color .15s ease,box-shadow .15s ease}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 4px rgba(20,184,166,.15)}
  label.lbl{font-size:13px;color:var(--slate-600);font-weight:600}
  .btn{padding:11px 18px;border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:14px;font-weight:700;
    transition:transform .06s ease,box-shadow .15s ease,filter .15s ease}
  .btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .btn-primary{background:linear-gradient(180deg,var(--teal-500),var(--teal-600));color:#fff;box-shadow:0 8px 20px rgba(13,148,136,.3)}
  .btn-primary:hover:not(:disabled){filter:brightness(1.05)}
  .btn-amber{background:linear-gradient(180deg,var(--amber-400),var(--amber-600));color:#fff;box-shadow:0 8px 20px rgba(217,119,6,.3)}
  .btn-danger{background:var(--danger-bg);color:#b91c1c}
  .btn-ghost{background:transparent;color:var(--teal-700);border:1px solid var(--teal-500)}
  .btn-full{width:100%;margin-top:16px}
  .btn-sm{padding:8px 12px;font-size:13px}
  .pill{display:inline-block;padding:4px 11px;border-radius:999px;color:#fff;font-size:12px;font-weight:700;letter-spacing:.02em}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:26px}
  .step-card{background:rgba(255,255,255,.9);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:22px;
    box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .2s ease}
  .step-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .step-card .num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;
    background:linear-gradient(180deg,var(--teal-500),var(--teal-600));color:#fff;font-weight:800;font-size:14px;margin-bottom:10px;
    box-shadow:0 6px 14px rgba(13,148,136,.28)}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .stat{background:rgba(255,255,255,.92);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:18px;
    box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--teal-500),var(--teal-700));opacity:.9}
  .stat-label{font-size:12px;color:var(--slate-500);letter-spacing:.04em;text-transform:uppercase;font-weight:700}
  .stat-value{font-size:22px;font-weight:800;letter-spacing:-.01em;margin-top:4px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
  .task-card{background:rgba(255,255,255,.94);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius);padding:18px;
    box-shadow:var(--shadow-sm);transition:transform .12s ease,box-shadow .2s ease}
  .task-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .task-card.premium-task{border-color:#fbbf24; background:linear-gradient(180deg,#fffbeb,#fff)}
  .row{background:rgba(255,255,255,.94);border:1px solid rgba(226,232,240,.9);border-radius:var(--radius-sm);padding:16px;margin:10px 0;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow-sm)}
  .banner{padding:14px 16px;border-radius:var(--radius-sm);font-weight:700;text-align:center;margin-bottom:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;padding:13px 22px;border-radius:12px;z-index:999;
    box-shadow:var(--shadow-lg);font-weight:600;animation:toastIn .22s ease}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
  .muted{color:var(--slate-500)}.center{text-align:center}
  .progress-bg{height:7px;background:rgba(148,163,184,.25);border-radius:999px;margin-top:10px;overflow:hidden}
  .progress-fg{height:100%;background:linear-gradient(90deg,var(--teal-500),var(--teal-700));border-radius:999px;transition:width .4s ease}
  .footer{text-align:center;margin-top:40px;padding:20px;color:var(--slate-400);font-size:13px}
  a{color:var(--teal-600)}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:-2px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .amount-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}
  .amount-btn{padding:14px 10px;border-radius:var(--radius-sm);border:2px solid var(--slate-200);background:#fff;cursor:pointer;
    font-weight:700;font-size:15px;transition:all .12s ease}
  .amount-btn:hover{border-color:var(--teal-400);box-shadow:var(--shadow-sm)}
  .amount-btn.selected{border-color:var(--teal-600);background:linear-gradient(180deg,var(--teal-50),#fff);color:var(--teal-700)}
  .support-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:18px}
  .support-card{background:rgba(255,255,255,.94);border:1px solid var(--slate-200);border-radius:var(--radius);padding:20px;
    box-shadow:var(--shadow-sm);text-decoration:none;color:var(--slate-900);transition:transform .12s ease,box-shadow .2s ease}
  .support-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
  .support-card .label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-500);font-weight:700}
  .support-card .val{font-size:16px;font-weight:700;margin-top:6px;word-break:break-all}
  .support-card .sub{font-size:12px;color:var(--slate-400);margin-top:4px}
  .support-card.wa{border-left:4px solid #25d366}
  .support-card.tg{border-left:4px solid #0088cc}
  .kv{display:grid;grid-template-columns:180px 1fr;gap:10px 16px;font-size:14px}
  .kv > div:nth-child(odd){color:var(--slate-500);font-weight:600}
  .kv > div:nth-child(even){word-break:break-word}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}

  .action-link{display:inline-flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;
    background:linear-gradient(180deg,var(--teal-500),var(--teal-600));color:#fff;font-weight:700;
    text-decoration:none;box-shadow:0 8px 20px rgba(13,148,136,.25);margin:6px 0 12px;transition:transform .06s ease,filter .15s ease}
  .action-link:hover{filter:brightness(1.05);transform:translateY(-1px)}
  .action-link svg{flex:0 0 18px}

  .section{border-bottom:1px solid var(--slate-200);padding:16px 0}
  .section:last-child{border-bottom:none}
  .section h3{margin:0 0 12px;font-size:15px;color:var(--slate-800)}

  .greet{background:linear-gradient(135deg, rgba(20,184,166,.14), rgba(251,191,36,.08));
    border:1px solid rgba(20,184,166,.28); border-radius:20px; padding:22px; margin-bottom:20px;
    display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap}
  .greet .hello{font-size:24px; font-weight:800; letter-spacing:-.02em; color:var(--slate-900); line-height:1.2}
  .greet .hello .name{background:linear-gradient(90deg,var(--teal-700),var(--teal-500),var(--amber-500));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .greet .sub{font-size:13.5px; color:var(--slate-600); margin-top:4px}
  .greet-meta{display:flex; gap:10px; flex-wrap:wrap}
  .greet-chip{background:#fff; border:1px solid var(--slate-200); border-radius:10px; padding:8px 12px; font-size:12px;
    display:flex; flex-direction:column; gap:2px; min-width:110px}
  .greet-chip .lbl{color:var(--slate-500); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.05em}
  .greet-chip .val{font-weight:700; color:var(--slate-900); font-size:13.5px}
  .greet-chip .val.mono{letter-spacing:.5px; color:var(--teal-700)}
  .greet-chip.earned{background:linear-gradient(180deg,#ecfdf5,#fff); border-color:#86efac}
  .greet-chip.earned .val{color:#15803d}

  .cta-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-top:14px}
  .cta{display:flex; align-items:center; gap:14px; padding:18px 20px; border-radius:16px; text-decoration:none; color:#fff;
    font-weight:700; transition:transform .12s ease, box-shadow .2s ease; box-shadow:var(--shadow)}
  .cta:hover{transform:translateY(-2px); box-shadow:var(--shadow-lg)}
  .cta svg{flex:0 0 30px}
  .cta .txt{display:flex; flex-direction:column; gap:2px; line-height:1.2}
  .cta .txt .t{font-size:16px}
  .cta .txt .s{font-size:12px; opacity:.9; font-weight:600}
  .cta.wa{background:linear-gradient(180deg,#25d366,#128c7e)}
  .cta.tg{background:linear-gradient(180deg,#2AABEE,#229ED9)}
  .cta.em{background:linear-gradient(180deg,#0d9488,#0f766e)}
  .support-note{background:#fffbeb; border:1px solid #fde68a; color:#78350f; border-radius:12px; padding:14px 16px; margin-top:16px; font-size:14px}

  .pool-bar{display:flex;height:8px;border-radius:6px;overflow:hidden;margin-top:6px;background:rgba(148,163,184,.2)}
  .pool-bar .seg{height:100%;transition:width .3s ease}
  .pool-bar .seg.reserved{background:linear-gradient(90deg,#7c3aed,#8b5cf6)}
  .pool-bar .seg.general{background:linear-gradient(90deg,#0d9488,#14b8a6)}
  .pool-bar .seg.filled{background:linear-gradient(90deg,#94a3b8,#64748b)}
  .pool-legend{display:flex;gap:10px;font-size:11px;color:var(--slate-500);margin-top:6px;flex-wrap:wrap}
  .pool-legend span{display:inline-flex;align-items:center;gap:4px}
  .pool-legend .dot{width:8px;height:8px;border-radius:999px;display:inline-block}
</style>
</head>

/* ---------- Reservation window math ---------- */
function taskReservedWindowHours(task){
  return Number(task.reserved_window_hours || DEFAULT_RESERVED_WINDOW_HOURS);
}
function taskReservedWindowActive(task){
  if(!task || !task.premium) return false;
  var windowMs = taskReservedWindowHours(task) * 3600 * 1000;
  var releaseAt = Number(task.created_at || 0) + windowMs;
  return Date.now() < releaseAt;
}
function taskReserveSecondsLeft(task){
  if(!taskReservedWindowActive(task)) return 0;
  var releaseAt = Number(task.created_at || 0) + taskReservedWindowHours(task) * 3600 * 1000;
  return Math.max(0, Math.floor((releaseAt - Date.now())/1000));
}
function humanizeSeconds(s){
  if(s <= 0) return "now";
  var h = Math.floor(s/3600);
  var m = Math.floor((s%3600)/60);
  if(h > 0) return h + "h " + m + "m";
  return m + "m";
}

/* ---------- Client-side pool estimate ----------
   This is a rough display estimate. The server is the source of truth. */
function estimateReserve(quantity){
  // Count paid users from what we know client-side (approximation).
  // Server uses the real counts. This is only for the card preview.
  var total = state._userCountEstimate || 0;
  var paid = state._paidUserCountEstimate || 0;
  if(!total || !paid) {
    // fall back to whatever the tier benefits tell us
    return Math.min(Math.floor(quantity/2), Math.max(2, Math.round(quantity * 0.15)));
  }
  var ratio = paid/total;
  var raw = Math.round(quantity * ratio);
  raw = Math.max(2, raw);
  return Math.min(Math.floor(quantity/2), raw);
}

function nextWithdrawDate(type, settings, tierBenefit){
  var arr = null;
  if(tierBenefit) arr = type==="task" ? tierBenefit.withdraw_task_days : tierBenefit.withdraw_affiliate_days;
  if(!arr && settings) arr = type==="task" ? settings.withdraw_task_days : settings.withdraw_affiliate_days;
  if(!arr || !arr.length) return "—";
  var allDow = true;
  for(var i=0;i<arr.length;i++) if(arr[i]>6) allDow=false;
  var today = new Date();
  for(var d=0; d<60; d++){
    var dt=new Date(today); dt.setDate(today.getDate()+d);
    if(allDow){ if(arr.indexOf(dt.getDay())!==-1) return dt.toDateString(); }
    else { if(arr.indexOf(dt.getDate())!==-1) return dt.toDateString(); }
  }
  return "—";
}
function isWithdrawDayToday(type, settings, tierBenefit){
  var arr = null;
  if(tierBenefit) arr = type==="task" ? tierBenefit.withdraw_task_days : tierBenefit.withdraw_affiliate_days;
  if(!arr && settings) arr = type==="task" ? settings.withdraw_task_days : settings.withdraw_affiliate_days;
  if(!arr || !arr.length) return true;
  var today = new Date();
  var allDow = true;
  for(var i=0;i<arr.length;i++) if(arr[i]>6) allDow=false;
  if(allDow) return arr.indexOf(today.getDay())!==-1;
  return arr.indexOf(today.getDate())!==-1;
}

async function startTask(taskId){
  var already = (state.submissions||[]).filter(function(s){
    return s.task_id === taskId && s.status !== "rejected";
  })[0];
  if(already){
    notify(already.status === "pending"
      ? "You already submitted this task. Awaiting admin review."
      : "You already completed this task.",
      "error");
    return;
  }
  try{
    var {data,error} = await sb.rpc("fn_start_task",{p_task_id:taskId,p_worker_id:state.user.id});
    if(error) throw new Error(error.message);
    state.activeStart = {
      startId:data.startId,
      startedAt:data.startedAt,
      taskId:taskId,
      pool: data.pool || "general"
    };
    state.currentTask = state.tasks.filter(function(t){return t.id===taskId})[0];
    go("task");
  }catch(e){ notify(e.message||"Could not start task","error") }
}

var pendingScreenshot=null;
function onProofFileChange(input){
  var f=input.files&&input.files[0]; if(!f){pendingScreenshot=null;return}
  var r=new FileReader();
  r.onload=function(){ pendingScreenshot=r.result };
  r.readAsDataURL(f);
}

async function submitTask(){
  var start=state.activeStart;
  if(!start){notify("No active task","error");return}
  var btn=document.getElementById("task-submit-btn");
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Submitting…'}
  try{
    var key = pendingScreenshot ? ("local:"+uid()) : null;
    var {data,error} = await sb.rpc("fn_submit_task",{
      p_start_id:start.startId, p_worker_id:state.user.id, p_screenshot_key:key
    });
    if(error) throw new Error(error.message);
    state.activeStart=null; pendingScreenshot=null;
    notify(data.status==="rejected" ? ("Auto-rejected: "+data.reason) : "Submitted — pending admin review",
           data.status==="rejected" ? "error":"success");
    await loadSubmissions();
    go("submissions");
  }catch(e){
    notify(e.message||"Submit failed","error");
    if(btn){btn.disabled=false;btn.textContent="Submit"}
  }
}

async function requestWithdrawal(){
  var type=state.wdType||"task";
  var amount=Number(document.getElementById("wd-amount").value);
  var tb = myTierBenefit();
  var min = type==="task"
    ? Number((tb && tb.withdraw_min_task) || (state.settings&&state.settings.withdraw_min_task) || 10000)
    : Number((tb && tb.withdraw_min_affiliate) || (state.settings&&state.settings.withdraw_min_affiliate) || 1000);
  if(!amount||amount<min){notify("Minimum is "+fmtN(min),"error");return}
  var bf=type==="task"?"task_balance":"affiliate_balance";
  if(Number(state.user[bf])<amount){notify("Insufficient balance","error");return}
  try{
    var {data,error} = await sb.rpc("fn_request_withdrawal",{p_user_id:state.user.id,p_type:type,p_amount:amount});
    if(error) throw new Error(error.message);
    var feePct  = Number((tb && tb.withdraw_fee_pct) || (state.settings&&state.settings.withdraw_fee_pct) || 0.2);
    var feeAmt  = Math.round(amount*feePct);
    notifyAdmin("New withdrawal request", {
      type: "Withdrawal — " + type + " earnings",
      user_display_id: displayIdFor(state.user),
      user_name: state.user.name,
      user_email: state.user.email,
      withdrawal_type: type,
      amount_gross: fmtN(amount),
      fee: fmtN(feeAmt),
      amount_net: fmtN(amount - feeAmt),
      withdrawal_id: data.withdrawalId
    });
    notify("Withdrawal requested — you'll receive "+fmtN(data.net),"success");
    await refreshAll();
    go("wallet");
  }catch(e){ notify(e.message||"Could not request","error") }
}

function updateTaskTotals(){
  var q=Math.max(MIN_TASK_QTY,Number(document.getElementById("ct-quantity").value)||MIN_TASK_QTY);
  var r=Number(document.getElementById("ct-reward").value)||0;
  var wt=r*q, com=wt*0.5, total=wt+com;
  document.getElementById("ct-worker-total").textContent=fmtN(wt);
  document.getElementById("ct-commission").textContent=fmtN(com);
  document.getElementById("ct-grand-total").textContent=fmtN(total);
  var bal=Number(state.user.advertiser_balance||0);
  var fundBtn=document.getElementById("ct-fund-hint");
  var submitBtn=document.getElementById("ct-submit-btn");
  if(fundBtn && submitBtn){
    if(bal<total){
      submitBtn.disabled=true;
      submitBtn.textContent="Insufficient balance — Fund wallet";
      fundBtn.style.display="block";
      fundBtn.textContent="You have "+fmtN(bal)+" — need "+fmtN(total)+". Click to fund.";
    } else {
      submitBtn.disabled=false;
      submitBtn.textContent="Submit for admin approval";
      fundBtn.style.display="none";
    }
  }
}
async function createTask(){
  var category=document.getElementById("ct-category").value;
  var link=document.getElementById("ct-link").value.trim();
  var quantity=Math.max(MIN_TASK_QTY,Number(document.getElementById("ct-quantity").value));
  var reward=Math.max(CATEGORIES[category].payout,Number(document.getElementById("ct-reward").value));
  var instructions=document.getElementById("ct-instructions").value.trim();
  var premium=document.getElementById("ct-premium").checked;
  if(!link){notify("Add a link","error");return}
  try{
    var {data,error} = await sb.rpc("fn_create_task",{
      p_advertiser_id:state.user.id, p_category:category, p_link:link,
      p_quantity:quantity, p_reward:reward, p_instructions:instructions, p_premium:premium

      ? "Premium task submitted. "+fmtN(data.advertiserTotal)+" held in escrow. Slots will be reserved for paid-tier workers."

function notifKindColor(k){
  var m={info:"#0f172a", success:"#16a34a", warning:"#d97706", money:"#0d9488", broadcast:"#7c3aed"};
  return m[k]||"#334155";
}
function timeAgo(ts){
  var s=Math.floor((Date.now()-Number(ts))/1000);
  if(s<60) return s+"s ago";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function renderNotifPanel(){
  var list = state.notifications.slice(0, 30);
  var html = list.length===0
    ? '<div class="notif-empty">No notifications yet.</div>'
    : list.map(function(n){
        var k=n.kind||"info";
        var color=notifKindColor(k);
        return '<div class="notif-item'+(n.read?"":" unread")+'" onclick="markNotifRead(\''+n.id+'\')">'+
          '<div class="t"><span class="kind" style="background:'+color+';">'+esc(k)+'</span>'+esc(n.title)+'</div>'+
          (n.body?'<div class="b">'+esc(n.body)+'</div>':"")+
          '<div class="m">'+timeAgo(n.ts)+'</div>'+
        '</div>';
      }).join("");
  return '<div class="notif-panel" onclick="event.stopPropagation()">'+
    '<div class="notif-head">'+
      '<h3>Notifications</h3>'+
      '<button onclick="markAllNotifsRead()">Mark all read</button>'+
    '</div>'+
    '<div class="notif-list">'+html+'</div>'+
  '</div>';
}

var heroPhrases=[
  "Complete simple social tasks. Get paid per completion.",
  "No daily caps. Work at your own pace.",

  "Screenshots stay on your device — we never store them.",

var typerState={el:null,phraseIdx:0,charIdx:0,dir:1,timer:null};
function startHeroTyper(){
  clearTimeout(typerState.timer);
  typerState.el=document.getElementById("hero-typer");
  if(!typerState.el) return;
  typerState.charIdx=0; typerState.dir=1;
  function tick(){
    var el=typerState.el; if(!el) return;
    var phrase=heroPhrases[typerState.phraseIdx];
    if(typerState.dir===1){
      typerState.charIdx++;
      if(typerState.charIdx>=phrase.length){
        el.textContent=phrase; typerState.dir=0;
        typerState.timer=setTimeout(function(){ typerState.dir=-1; tick() },1600);
        return;
      }
    } else {
      typerState.charIdx--;
      if(typerState.charIdx<=0){
        typerState.charIdx=0; typerState.dir=1;
        typerState.phraseIdx=(typerState.phraseIdx+1)%heroPhrases.length;
      }
    }
    el.textContent=phrase.slice(0,typerState.charIdx);
    typerState.timer=setTimeout(tick, typerState.dir===1?38:20);
  }
  tick();
}

/* ---------- Pool estimation for card display ---------- */
function taskPoolInfo(task){
  // Rough client-side estimate of the pool split. Server is authoritative.
  var q = Number(task.quantity||0);
  var completed = Number(task.completed||0);
  var remaining = Math.max(0, q - completed);

  if(!task.premium){
    return { premium:false, reservedSlots:0, generalSlots:remaining, reservedTaken:0, generalTaken:0, inWindow:false };
  }

  var inWindow = taskReservedWindowActive(task);

  // Compute reserve the same way the server does (using our user count estimate)
  var reserve;
  if(!inWindow){
    reserve = 0;
  } else {
    reserve = estimateReserve(q);
  }

  // For display, we just show the reserve number and remaining.
  // Actual taken-per-pool comes from server when we know it, but for
  // the card we approximate by treating the reserve as still open.
  var reservedTaken = Math.min(completed, reserve);
  var generalTaken = Math.max(0, completed - reservedTaken);
  var reservedLeft = Math.max(0, reserve - reservedTaken);
  var generalLeft = Math.max(0, remaining - reservedLeft);

  return {
    premium: true,
    reservedSlots: reserve,
    generalSlots: q - reserve,
    reservedTaken: reservedTaken,
    generalTaken: generalTaken,
    reservedLeft: reservedLeft,
    generalLeft: generalLeft,
    inWindow: inWindow,
    windowSecondsLeft: taskReserveSecondsLeft(task)
  };
}

function renderDashboard(){
  var user=state.user, tier=tierById(user.tier_id);
  var blocked=isBlockedDay(state.settings);

  var submittedTaskIds = {};
  (state.submissions||[]).forEach(function(s){
    if(s.status !== "rejected") submittedTaskIds[s.task_id] = s.status;
  });

  var paid = isPaidTier(user.tier_id);

  // Filter: hide tasks the user has submitted; for premium tasks, hide from free users ONLY when reserved window is active AND no general slots left.
  var liveTasks = state.tasks.filter(function(t){
    if(t.status !== "live") return false;
    if(submittedTaskIds[t.id]) return false;

    var p = taskPoolInfo(t);
    if(!p.premium){
      return t.completed < t.quantity;
    }

    // Premium task
    if(paid) {
      // Paid users see it as long as any slot remains
      return (p.reservedLeft + p.generalLeft) > 0;
    }
    // Free users: see it only if general slots remain OR the reserved window has closed and slots remain
    if(!p.inWindow){
      return t.completed < t.quantity;
    }
    return p.generalLeft > 0;
  });

  // Executive: bump premium to top
  if(user.tier_id === "executive"){
    liveTasks.sort(function(a,b){
      var ap = a.premium ? 1 : 0;
      var bp = b.premium ? 1 : 0;
      if(ap !== bp) return bp - ap;
      return Number(b.created_at||0) - Number(a.created_at||0);
    });
  }

  var banner = blocked
    ? '<div class="banner" style="background:#fef3c7;color:#92400e;">Tasks are paused today. Come back on an active day.</div>'
    : "";

  // Nudge free users when premium tasks exist but they can't start one right now
  if(!blocked && !paid){
    var hiddenPremium = state.tasks.filter(function(t){
      return t.status==="live" && t.premium && taskReservedWindowActive(t) && taskPoolInfo(t).generalLeft <= 0;
    }).length;
    if(hiddenPremium > 0){
      banner += '<div class="banner" style="background:#eef2ff;color:#3730a3;text-align:left;">'+
        '<strong>'+hiddenPremium+' premium task'+(hiddenPremium===1?'':'s')+'</strong> '+
        'have all their general slots filled. Reserved slots open to everyone when the timer ends. '+
        '<a href="#" onclick="go(\'upgrade\');return false;" style="color:#4338ca;font-weight:700;">Upgrade to unlock instantly →</a>'+
        '</div>';
    }
  }

  var tasksHtml=liveTasks.length===0
    ? '<p class="muted">No tasks available right now. Check back soon.</p>'
    : '<div class="grid">'+liveTasks.map(function(t){
        var cat=CATEGORIES[t.category]||{color:"#0d9488"};
        var p = taskPoolInfo(t);
        var premiumBadge = t.premium ? ' <span class="pill" style="background:#f59e0b;">★ PREMIUM</span>' : "";
        var windowBadge = (t.premium && p.inWindow) ? ' <span class="pill" style="background:#7c3aed;">reserved · '+humanizeSeconds(p.windowSecondsLeft)+'</span>' : "";

        // Show pool info line
        var poolLine = "";
        if(t.premium){
          var totalRemaining = p.reservedLeft + p.generalLeft;
          if(p.inWindow){
            if(paid){
              poolLine = '<div class="pool-legend">'+
                '<span><span class="dot" style="background:#7c3aed;"></span>'+p.reservedLeft+' reserved</span>'+
                '<span><span class="dot" style="background:#0d9488;"></span>'+p.generalLeft+' general</span>'+
                '</div>';
            } else {
              poolLine = '<div class="pool-legend">'+
                '<span><span class="dot" style="background:#0d9488;"></span>'+p.generalLeft+' open to you</span>'+
                '<span class="muted">· reserved slots unlock in '+humanizeSeconds(p.windowSecondsLeft)+'</span>'+
                '</div>';
            }
          } else {
            poolLine = '<div class="pool-legend">'+
              '<span><span class="dot" style="background:#0d9488;"></span>'+totalRemaining+' open to everyone</span>'+
              '</div>';
          }
        }

        var completedLine = t.completed+'/'+t.quantity+' completed';

        return '<div class="task-card'+(t.premium?' premium-task':'')+'">'+
          '<span class="pill" style="background:'+cat.color+';">'+t.category+'</span>'+premiumBadge+windowBadge+
          '<h3 style="margin:10px 0 4px;">'+fmtN(t.reward)+' <span class="muted" style="font-size:13px;">per completion</span></h3>'+
          '<p class="muted" style="font-size:14px;min-height:40px;">'+esc(t.instructions).slice(0,90)+'…</p>'+
          '<div class="muted" style="font-size:12px;">'+completedLine+'</div>'+
          poolLine+
          '<button class="btn btn-primary" style="width:100%;margin-top:10px;" '+(blocked?"disabled":"")+' onclick="startTask(\''+t.id+'\')">'+actionButtonLabel(t.category, blocked)+'</button>'+
        '</div>';
      }).join("")+'</div>';

  return '<div style="padding-top:8px;">'+
    greetBanner(user)+
    banner+
    '<div class="stats-row">'+
      '<div class="stat"><div class="stat-label">Task balance</div><div class="stat-value">'+fmtN(user.task_balance)+'</div></div>'+
      '<div class="stat"><div class="stat-label">Advertiser balance</div><div class="stat-value">'+fmtN(user.advertiser_balance)+'</div></div>'+
      '<div class="stat"><div class="stat-label">Affiliate balance</div><div class="stat-value">'+fmtN(user.affiliate_balance)+'</div></div>'+
      '<div class="stat"><div class="stat-label">Tier</div><div class="stat-value">'+tier.name+'</div></div>'+
    '</div>'+
    '<div style="display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;">'+
      '<button class="btn btn-primary" onclick="go(\'myAccount\')">My Account</button>'+
      '<button class="btn btn-amber" onclick="go(\'wallet\')">Withdraw</button>'+
      '<button class="btn btn-ghost" onclick="go(\'fundWallet\')">Fund wallet</button>'+
      '<button class="btn btn-ghost" onclick="go(\'createTask\')">Post a task</button>'+
    '</div>'+
    '<h2 style="margin-top:28px;">Available tasks</h2>'+tasksHtml+
  '</div>';
}

function ledgerKind(l){
  if(!l.note) return "other";
  var n=l.note.toLowerCase();
  if(n.indexOf("wallet funding")!==-1) return "funding";
  if(n.indexOf("task funding")!==-1) return "task_funding";
  if(n.indexOf("task cancelled")!==-1) return "refund";
  if(n.indexOf("withdrawal")!==-1) return "withdrawal";
  if(n.indexOf("referral")!==-1) return "affiliate";
  if(n.indexOf("tier")!==-1 || n.indexOf("membership")!==-1) return "tier";
  if(n.indexOf("admin adjustment")!==-1) return "adjustment";
  if(l.type==="task") return "task";
  if(l.type==="affiliate") return "affiliate";
  return "other";
}
function ledgerLabel(k){
  var m={
    all:"All transactions", task:"Task earnings", affiliate:"Referral earnings",
    funding:"Wallet fundings", task_funding:"Task fundings", refund:"Refunds",
    withdrawal:"Withdrawals", tier:"Tier upgrades", adjustment:"Admin adjustments", other:"Other"
  };
  return m[k]||k;
}

  var warnings = [];
  state.withdrawals.forEach(function(w){
    if(w.status === "pending" && hoursAgo(w.ts) >= 24){
      warnings.push('<div class="banner" style="background:#fef3c7;color:#92400e;text-align:left;">'+
        'Your '+w.type+' withdrawal of '+fmtN(w.amount)+' has been pending for over 24 hours. '+

        '</div>');
    }
    if(w.status === "approved" && !w.received_confirmed && w.approved_at && hoursAgo(w.approved_at) >= 24){
      warnings.push('<div class="banner" style="background:#fee2e2;color:#991b1b;text-align:left;">'+
        'Your '+w.type+' withdrawal of '+fmtN(w.net)+' was approved more than 24 hours ago. '+
        'If you have not received it, <a href="#" onclick="go(\'support\');return false;" style="color:#7c2d12;font-weight:700;">contact support</a>. '+

        '</div>');
    }
    if(w.status === "approved" && !w.received_confirmed && w.approved_at && hoursAgo(w.approved_at) < 24){
      warnings.push('<div class="banner" style="background:#ecfdf5;color:#065f46;text-align:left;">'+
        'Your '+w.type+' withdrawal of '+fmtN(w.net)+' was approved. Once you receive it, please confirm: '+
        '<button class="btn btn-sm btn-primary" style="margin-left:8px;" onclick="markWithdrawalReceived(\''+w.id+'\')">I received it</button>'+

  });

  var minTask = Number((tb && tb.withdraw_min_task) || (state.settings&&state.settings.withdraw_min_task) || 10000);
  var minAff  = Number((tb && tb.withdraw_min_affiliate) || (state.settings&&state.settings.withdraw_min_affiliate) || 1000);
  var feePct  = Number((tb && tb.withdraw_fee_pct) || (state.settings&&state.settings.withdraw_fee_pct) || 0.2);
  var canTask = isWithdrawDayToday("task", state.settings, tb);
  var canAff  = isWithdrawDayToday("affiliate", state.settings, tb);
  var nextTask = nextWithdrawDate("task", state.settings, tb);
  var nextAff  = nextWithdrawDate("affiliate", state.settings, tb);

  var approvedPayout = (state.payoutMethods||[]).filter(function(m){return m.status==="approved"})[0];

  var withdrawBlock = "";

    withdrawBlock = '<div class="banner" style="background:#fef3c7;color:#92400e;">You need an approved payout method before you can withdraw. <a href="#" onclick="go(\'payout\');return false;" style="color:#0f766e;font-weight:700;">Add one →</a></div>';
  } else {
    withdrawBlock =
      '<select id="wd-type" onchange="state.wdType=this.value;render()">'+
        '<option value="task"'+(state.wdType==="task"?" selected":"")+'>Task earnings — min '+fmtN(minTask)+' — next '+nextTask+'</option>'+
        '<option value="affiliate"'+(state.wdType==="affiliate"?" selected":"")+'>Affiliate earnings — min '+fmtN(minAff)+' — next '+nextAff+'</option>'+
      '</select>'+
      '<input id="wd-amount" type="number" placeholder="Amount" />'+
      '<p class="muted" style="font-size:12px;">Fee: '+(feePct*100).toFixed(0)+'% of the amount. Paid to your approved bank: '+esc(approvedPayout.bank_name)+' ••••'+esc(approvedPayout.account_number.slice(-4))+'</p>';
    var currentDayAllowed = state.wdType==="affiliate" ? canAff : canTask;
    if(!currentDayAllowed){
      withdrawBlock += '<button class="btn btn-amber btn-full" disabled>Withdrawals closed today</button>'+
        '<p class="muted" style="font-size:12px;">Task: next '+nextTask+' &middot; Affiliate: next '+nextAff+'</p>';
    } else {
      withdrawBlock += '<button class="btn btn-amber btn-full" onclick="requestWithdrawal()">Request withdrawal</button>';
    }
  }

  return warnings.join("")+
    '<div class="stats-row">'+
      '<div class="stat"><div class="stat-label">Task balance</div><div class="stat-value">'+fmtN(user.task_balance)+'</div></div>'+
      '<div class="stat"><div class="stat-label">Advertiser balance</div><div class="stat-value">'+fmtN(user.advertiser_balance)+'</div></div>'+
      '<div class="stat"><div class="stat-label">Affiliate balance</div><div class="stat-value">'+fmtN(user.affiliate_balance)+'</div></div>'+
    '</div>'+
    '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">'+
      '<button class="btn btn-primary" onclick="go(\'fundWallet\')">Fund wallet</button>'+
      '<button class="btn btn-ghost" onclick="go(\'payout\')">Payout method</button>'+
      '<button class="btn btn-ghost" onclick="go(\'myAccount\')">My Account</button>'+
    '</div>'+
    '<div class="card wide" style="margin-top:20px;">'+
      '<h3>Withdraw earnings</h3>'+
      withdrawBlock+
    '</div>'+
    '<h3 style="margin-top:24px;">Transaction history</h3>'+
    '<select id="lf" onchange="state.ledgerFilter=this.value;render()">'+filterOpts+'</select>'+
    ledgerHtml;

        '<div style="display:flex;justify-content:space-between;align-items:center;"><strong>Current payout method</strong><span class="pill" style="background:#16a34a;">approved</span></div>'+
        '<div class="muted" style="font-size:14px;margin-top:6px;">'+esc(approved.bank_name)+' — ••••'+esc(approved.account_number.slice(-4))+'</div>'+
        '<div class="muted" style="font-size:12px;">Account name: '+esc(approved.account_name)+'</div>'+
      '</div>'+
      '<button class="btn btn-ghost btn-full" onclick="openPayoutForm()">Request change</button>'+
      '<p class="muted" style="font-size:12px;">To change your bank account, submit a new one. Admin approval required.</p>';
    } else if(pending){
      html += '<div class="banner" style="background:#fef3c7;color:#92400e;">Your payout method is pending admin approval.</div>'+
        '<div class="row" style="flex-direction:column;align-items:stretch;">'+
          '<strong>'+esc(pending.bank_name)+' — ••••'+esc(pending.account_number.slice(-4))+'</strong>'+
          '<div class="muted" style="font-size:12px;">Submitted '+new Date(Number(pending.ts)).toLocaleString()+'</div>'+
        '</div>'+
        '<button class="btn btn-ghost btn-full" onclick="openPayoutForm()">Submit a different one</button>';
    } else {
      html += '<p class="muted">You have not added a payout method yet.</p>'+
        '<button class="btn btn-primary btn-full" onclick="openPayoutForm()">Add payout method</button>';
    }
    var history = mine.filter(function(m){return m.status!=="approved"}).slice(0,5);
    if(history.length){
      html += '<h3 style="margin-top:22px;">History</h3>';
      html += history.map(function(m){
        var c = m.status==="pending" ? "#d97706" : m.status==="rejected" ? "#dc2626" : "#16a34a";
        return '<div class="row"><div>'+
          '<strong>'+esc(m.bank_name)+' ••••'+esc(m.account_number.slice(-4))+'</strong>'+
          '<div class="muted" style="font-size:12px;">'+new Date(Number(m.ts)).toLocaleString()+'</div>'+
          (m.admin_note?'<div style="font-size:12px;color:#dc2626;">'+esc(m.admin_note)+'</div>':"")+
        '</div><span class="pill" style="background:'+c+';">'+m.status+'</span></div>';
      }).join("");
    }
  }
  return '<div class="card">'+
    '<h2>Payout method</h2>'+
    '<p class="muted" style="font-size:13px;">Where your withdrawal money will be sent. Must be approved by admin before you can withdraw.</p>'+
    html+
  '</div>';
}

      (s.telegram_group_link ? '<a class="support-card tg" href="'+esc(s.telegram_group_link)+'" target="_blank" rel="noopener"><div class="label">Telegram group</div><div class="val">Join the community</div></a>' : "")+

            return '<td style="padding:10px; border-bottom:1px solid var(--slate-100);'+(t.id===currentTierId?' background:linear-gradient(180deg,#f0fdfa,#fff); font-weight:600;':'')+'">'+pair[1](b)+'</td>';
          }).join("")+
        '</tr>';

    html='<p class="muted" style="font-size:13px;">Current tier: <strong>'+tierById(currentTierId).name+'</strong></p>'+

      '<button class="btn btn-primary btn-full" onclick="revealBank()">Get bank details</button>';

    html='<div style="background:linear-gradient(135deg, rgba(20,184,166,.10), rgba(251,191,36,.06)); border:1px solid rgba(20,184,166,.25); border-radius:12px; padding:18px; margin-top:12px;">'+
      '<div>Account number: <strong>'+esc(bank.number)+'</strong></div>'+

function renderMyTasks(){
  var mine=state.tasks.filter(function(t){return t.advertiser_id===state.user.id});
  sb.from("tasks").select("*").eq("advertiser_id",state.user.id).order("created_at",{ascending:false}).then(function(res){
    if(res.data && res.data.length!==state.myTasksCount){
      state.myTasksCount=res.data.length;
      state._myTasks=res.data;
      if(state.route==="myTasks") render();
    }
  });
  var list=state._myTasks||mine;
  var rows=list.length===0?'<p class="muted">You haven\'t posted any tasks yet.</p>':list.map(function(t){
    var statusColor=t.status==="live"?"#16a34a":t.status==="completed"?"#0d9488":t.status==="paused"?"#94a3b8":t.status==="cancelled"?"#dc2626":"#d97706";
    var pct=Math.min(100,(t.completed/t.quantity)*100);
    var p = taskPoolInfo(t);
    var poolLine = "";
    if(t.premium){
      if(p.inWindow){
        poolLine = '<div class="pool-legend" style="margin-top:6px;">'+
          '<span><span class="dot" style="background:#7c3aed;"></span>'+p.reservedLeft+' reserved (open in '+humanizeSeconds(p.windowSecondsLeft)+')</span>'+
          '<span><span class="dot" style="background:#0d9488;"></span>'+p.generalLeft+' general</span>'+
          '</div>';
      } else {
        poolLine = '<div class="pool-legend" style="margin-top:6px;">'+
          '<span><span class="dot" style="background:#0d9488;"></span>All '+ (p.reservedLeft + p.generalLeft) +' remaining slots open to everyone</span>'+
          '</div>';
      }
    }
    return '<div class="row" style="flex-direction:column;align-items:stretch;">'+
      '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;">'+
        '<strong>'+t.category+' &middot; '+fmtN(t.reward)+'/task'+(t.premium?' <span class="pill" style="background:#f59e0b;">★ PREMIUM</span>':'')+'</strong>'+
        '<span class="pill" style="background:'+statusColor+';">'+t.status+'</span>'+
      '</div>'+
      '<div class="muted" style="font-size:14px;margin-top:6px;">'+t.completed+'/'+t.quantity+' completed &middot; '+fmtN(t.completed*t.reward*1.5)+' of '+fmtN(t.escrow_total||t.advertiser_total)+' spent &middot; '+fmtN(t.escrow_remaining||0)+' remaining in escrow</div>'+
      poolLine+
      '<div class="progress-bg"><div class="progress-fg" style="width:'+pct+'%;"></div></div>'+
    '</div>';
  }).join("");
  return '<h2>My posted tasks</h2>'+rows;
}

function render(){
  var user=state.user, r=state.route, body="";
  if(r==="loading"){ document.getElementById("root").innerHTML='<div class="card center"><p class="muted">Loading…</p></div>'; return }
  if(r==="landing") body=renderLanding();
  else if(r==="signup") body=renderSignup();
  else if(r==="login") body=renderLogin();
  else if(!user) body=renderLanding();
  else if(r==="dashboard") body=renderDashboard();
  else if(r==="myAccount") body=renderMyAccount();
  else if(r==="task") body=renderTaskDetail();
  else if(r==="submissions") body=renderSubmissions();
  else if(r==="wallet") body=renderWallet();
  else if(r==="payout") body=renderPayout();
  else if(r==="fundWallet") body=renderFundWallet();
  else if(r==="support") body=renderSupport();
  else if(r==="upgrade") body=renderUpgrade();
  else if(r==="createTask") body=renderCreateTask();
  else if(r==="myTasks") body=renderMyTasks();
  else if(r==="settings") body=renderSettings();
  else body=user?renderDashboard():renderLanding();

  document.getElementById("root").innerHTML=renderTopBar()+'<div>'+body+'</div>'+'<div id="toast" class="toast" style="display:none;"></div>';
  renderDrawer();
  if(r==="task" && state.activeStart) startTaskTimer();
  if(r==="landing") startHeroTyper();
  if(r==="createTask") updateTaskTotals();
}

function startTaskTimer(){
  clearInterval(activeStartTimer);
  activeStartTimer=setInterval(function(){
    var s=state.activeStart;
    if(!s||state.route!=="task"){clearInterval(activeStartTimer);return}
    var elapsed=Date.now()-s.startedAt;
    var remaining=Math.max(0,TARGET_ON_PAGE_MS-elapsed);
    var t=document.getElementById("task-timer");
    var b=document.getElementById("task-submit-btn");
    if(t){
      t.textContent=remaining>0?("Stay on this page for "+(remaining/1000).toFixed(1)+"s"):"You may submit now";
      t.style.background=remaining>0?"#fef3c7":"#dcfce7";
      t.style.color=remaining>0?"#92400e":"#166534";
    }
    if(b) b.disabled=remaining>0;
  },200);
}

var notifPollInterval=null;
function startNotifPolling(){
  clearInterval(notifPollInterval);
  notifPollInterval = setInterval(async function(){
    if(!state.user) return;
    await loadNotifications();
    var badge = document.querySelector(".bell-badge");
    var unread = state.notifications.filter(function(n){return !n.read}).length;
    var bell = document.querySelector(".bell");
    if(bell){
      if(unread>0){
        if(badge) badge.textContent = unread>99?"99+":unread;
        else{
          var b = document.createElement("span");
          b.className="bell-badge"; b.textContent = unread>99?"99+":unread;
          bell.appendChild(b);
        }
      } else if(badge){ badge.remove(); }
    }
  }, 30000);
}

document.addEventListener("click", function(e){
  if(state.notifPanelOpen && !e.target.closest(".notif-panel") && !e.target.closest(".bell")){
    state.notifPanelOpen = false; render();
  }
});

(async function boot(){
  await refreshAll();
  if(state.user){
    state.route="dashboard";
    startNotifPolling();
    maybeAskNotifPermission();
  } else {
    state.route="landing";
  }
  render();
})();
</script>
</body>
</html>
